name: Benchmark F Prime Compile
description: Benchmark FPP generation and the downstream F Prime build

inputs:
  fprime-directory:
    description: Prepared F Prime checkout path
    required: true
  fprime-venv:
    description: Prepared F Prime virtual environment path
    required: true
  summary-label:
    description: Platform label for the GitHub step summary
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        FPRIME_DIR: ${{ inputs.fprime-directory }}
        FPRIME_VENV: ${{ inputs.fprime-venv }}
        SUMMARY_LABEL: ${{ inputs.summary-label }}
      run: |
        export PATH="$GITHUB_WORKSPACE/compiler/bin:$FPRIME_VENV/bin:$PATH"
        export CFLAGS="-Wno-error=overloaded-virtual"
        export CXXFLAGS="$CFLAGS"
        test "$(command -v fpp)" = "$GITHUB_WORKSPACE/compiler/bin/fpp"
        # nasa/fprime #5386 (2026-09-08) added Rust component Svc.WasmSequencer
        # to Ref's topology; without cargo CMake drops the module and fpp-to-dict
        # errors "symbol WasmSequencer is not defined". macOS runners ship Rust;
        # the manylinux container does not. MSRV is 1.87 (Rust 2024 edition).
        if ! command -v cargo >/dev/null 2>&1
        then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.87.0
        fi
        export PATH="$HOME/.cargo/bin:$PATH"

        export FPP_REAL_BIN="$GITHUB_WORKSPACE/compiler/bin"
        export FPP_TOOL_LOG="$RUNNER_TEMP/fpp-tool-timing.log"
        SHIM="$RUNNER_TEMP/fpp-shim"
        mkdir -p "$SHIM"
        : > "$FPP_TOOL_LOG"
        {
          printf '#!/usr/bin/env bash\n'
          printf 'tool=$(basename "$0")\n'
          printf 's=$(date +%%s.%%N)\n'
          printf '"$FPP_REAL_BIN/$tool" "$@"; rc=$?\n'
          printf 'e=$(date +%%s.%%N)\n'
          printf 'awk -v a="$s" -v b="$e" -v t="$tool" '\''BEGIN { printf "%%s %%.3f\\n", t, b - a }'\'' >> "$FPP_TOOL_LOG"\n'
          printf 'exit $rc\n'
        } > "$SHIM/fpp-tool-wrapper"
        chmod +x "$SHIM/fpp-tool-wrapper"
        for tool in fpp-depend fpp-to-cpp fpp-to-dict fpp-locate-defs \
          fpp-locate-uses fpp-filenames
        do
          ln -sf fpp-tool-wrapper "$SHIM/$tool"
        done
        export PATH="$SHIM:$PATH"

        cd "$FPRIME_DIR/TestDeploymentsProject"

        # Recreate the build cache, then compile the deployment
        TIMEFORMAT='FPP_GENERATE_SECONDS=%3R'
        { time fprime-util generate --force; } 2>&1 | tee "$RUNNER_TEMP/fpp-generate-benchmark.log"
        TIMEFORMAT='FPP_BUILD_SECONDS=%3R'
        { time fprime-util build -j4; } 2>&1 | tee "$RUNNER_TEMP/fpp-build-benchmark.log"

        generate=$(sed -n 's/^FPP_GENERATE_SECONDS=//p' "$RUNNER_TEMP/fpp-generate-benchmark.log" | tail -1)
        build=$(sed -n 's/^FPP_BUILD_SECONDS=//p' "$RUNNER_TEMP/fpp-build-benchmark.log" | tail -1)
        test -n "$generate"
        test -n "$build"
        total=$(awk -v generate="$generate" -v build="$build" 'BEGIN { printf "%.3f", generate + build }')
        {
          printf '### %s\n\n' "$SUMMARY_LABEL"
          printf '| Phase | Seconds |\n|---|---:|\n'
          printf '| Generate | %s |\n| Build (`-j4`) | %s |\n| Total | %s |\n' \
            "$generate" "$build" "$total"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -s "$FPP_TOOL_LOG" ]
        then
          {
            printf '\n#### %s - per-fpp-tool (sum of invocations)\n\n' \
              "$SUMMARY_LABEL"
            printf '| Tool | Calls | Total s |\n|---|---:|---:|\n'
            awk '{ c[$1]++; s[$1] += $2 }
                 END { for (t in s) printf "| %s | %d | %.3f |\n", t, c[t], s[t] }' \
              "$FPP_TOOL_LOG" | sort
          } >> "$GITHUB_STEP_SUMMARY"
        else
          printf '::warning::no fpp-tool timings captured (shim not on PATH?)\n'
        fi
